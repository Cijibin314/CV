        function makeShort(prePos){
            switch(prePos.length){
                case 3:
                    shortPos = parseInt(`${prePos[0]}`)
                      
                    break;
                case 4:
                    shortPos = parseInt(`${prePos[0]}${prePos[1]}`)
                      
                    break;
                case 5:
                    shortPos = parseInt(`${prePos[0]}${prePos[1]}${prePos[2]}`)
                      
                    break;
            }
            return shortPos

            element1 = '.' + element1

            let elementTop1 = makeShort(getComputedStyle(document.querySelector(element1)).top)
            let elementLeft2 = makeShort(getComputedStyle(document.querySelector(element2)).left)

            let diam2 = makeShort(getComputedStyle(document.querySelector(element2)).height)

            let diamEl12 = makeShort(getComputedStyle(document.querySelector(element1)).height)
                    if(((((elementLeft2 + diam1 < elementLeft1) === false)) && ((elementLeft2 > elementLeft1 + diamEl11) === false))){

                            }}}}}
        function goDirection(direction, element, _speed){
            element = '.' + element
            const  coords  = {
                'left' : makeShort(getComputedStyle(document.querySelector(element)).left),
                'top' : makeShort(getComputedStyle(document.querySelector(element)).top)
            }
            let __diam = makeShort(getComputedStyle(document.querySelector(element)).width)
            if(direction === 'right'){
                 coords.left += _speed
            }
            else if(direction === 'left'){
                 coords.left -= _speed
            }
            else if(direction === 'down'){
                 coords.top += _speed
            }
            else if(direction === 'up'){
                 coords.top -= _speed
            } else if(direction === "downright"){
                 coords.top += _speed
                 coords.left += _speed 
            } else if(direction === "downleft"){
                coords.top += _speed   
                coords.left -= _speed
            } else if(direction === "upright"){
                 coords.top -= _speed
                 coords.left += _speed
            } else if(direction === "upleft"){
                 coords.top -= _speed
                 coords.left -= _speed
            } else{
                if(timer > 5 && !gameOverVar){
                //console.log('No such direction')
                }
            }
            //too far right
            
            //too far left
            if(__diam === 50){
                __diam = 0;
            }
            
            if((coords.left >= 950 + __diam) && (element !== '.enemy')){
                
                    coords.left = 0
                    /*if(element === '.playerProjectile1'){
                        projectileMoving = false;
                        coords.left = getComputedStyle(document.querySelector('.player')).left
                        document.querySelector('.playerProjectile1').style.visibility = 'hiddden'
                    }*/
            }

                     coords.left = 952
                    /*if(element === '.playerProjectile1'){
                        projectileMoving = false;
                        coords.left = getComputedStyle(document.querySelector('.player')).left
                        document.querySelector('.playerProjectile1').style.visibility = 'hiddden'
                    }*/
            }

            if(coords.top + __diam >= 700 && element !== '.enemy'){
                     coords.top = 60
                     /*if(element === '.playerProjectile1'){
                        projectileMoving = false;
                        coords.top = getComputedStyle(document.querySelector('.player')).top
                        document.querySelector('.playerProjectile1').style.visibility = 'hiddden'
                    }*/
            }
            //too far up

            else if( coords.top <= 53 && element !== '.enemy'){
                     coords.top = 700
                     /*if(element === '.playerProjectile1'){
                        projectileMoving = false;
                        coords.top = getComputedStyle(document.querySelector('.player')).top
                        document.querySelector('.playerProjectile1').style.visibility = 'hiddden'
                    }*/
            }
            
            
            document.querySelector(element).style.left = `${coords.left}px`
            document.querySelector(element).style.top = `${coords.top}px`
        }
        // enemy / gameOver
        function whichWay(el){
            let playerCoords;
            let badGuyCoords;
            if(el === 'enemy'){
            playerCoords={
                'left' : makeShort(getComputedStyle(document.querySelector('.player')).left),
                'top' : makeShort(getComputedStyle(document.querySelector('.player')).top)
            }
            badGuyCoords={

            }
            //console.log(playerCoords + ' ' + badGuyCoords + '  enemy')
        }
            
            else if(el === 'bullet'){

                'left' : makeShort(getComputedStyle(document.querySelector('.playerProjectile1')).left),
                'top' : makeShort(getComputedStyle(document.querySelector('.playerProjectile1')).top)

            //mouse coords

            }
            //console.log(playerCoords + ' ' + badGuyCoords + '  my special')
        } else{
            console.log('problemioski')
        }
            
            let returnVal = ''
            //console.log(playerCoords)
            if((playerCoords.top > badGuyCoords.top)&&(playerCoords.left > badGuyCoords.left)){
                returnVal =  'downright'
            } else if((playerCoords.top > badGuyCoords.top)&&(playerCoords.left < badGuyCoords.left)){
                returnVal =  'downleft'
            } else if((playerCoords.top < badGuyCoords.top)&&(playerCoords.left > badGuyCoords.left)){
                returnVal =  'upright'
            } else if((playerCoords.top < badGuyCoords.top)&&(playerCoords.left < badGuyCoords.left)){
                returnVal =  'upleft'
            }
            else if(playerCoords.top > badGuyCoords.top){
                returnVal =  'down'
            } else if(playerCoords.top < badGuyCoords.top){
                returnVal =  'up'
            } else if(playerCoords.left < badGuyCoords.left){
                returnVal =  'left'
            } else if(playerCoords.left > badGuyCoords.left){
                returnVal =  'right'
            }
            return returnVal

        }
